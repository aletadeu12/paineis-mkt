*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,Arial,sans-serif;background:#F0F2F5;color:#1F2937;font-size:14px;}
.topbar{background:var(--primary);color:white;padding:12px 20px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;}

.tab:hover{color:#374151;background:#F9FAFB;}
.tab.active{color:var(--primary);border-bottom-color:var(--primary);}
.page{display:none;padding:20px;max-width:1100px;margin:0 auto;}
.page.active{display:block;}
.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-bottom:20px;}
.card{background:white;border-radius:10px;padding:16px;border:1px solid var(--border);}
.card-title{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--gray);}
.section-title{font-size:13px;font-weight:700;color:var(--dark);margin:20px 0 10px;display:flex;align-items:center;gap:8px;}

.files-bar{background:white;border:1px solid var(--border);border-radius:10px;padding:14px 16px;margin-bottom:20px;}
.files-bar-title{font-size:12px;font-weight:700;color:var(--dark);margin-bottom:10px;}
.files-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:8px;}
.path-row{display:flex;align-items:center;gap:8px;background:#F8FAFC;border:1px solid #CBD5E1;border-radius:6px;padding:7px 10px;}
.path-icon{font-size:15px;flex-shrink:0;}
.path-info{flex:1;min-width:0;}
.path-name{font-size:12px;font-weight:600;color:#1F2937;}
.path-txt{font-family:monospace;font-size:10px;color:#64748B;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.btn-row{display:flex;gap:5px;flex-shrink:0;}
.copy-btn{padding:4px 9px;background:#0A1B33;color:white;border:none;border-radius:4px;font-size:11px;font-weight:700;cursor:pointer;transition:background .2s;}
.copy-btn:hover{background:#1E90FF;}
.copy-btn.ok{background:#16A085;}
.drive-btn{padding:4px 9px;background:var(--primary);color:white;border:none;border-radius:4px;font-size:11px;font-weight:700;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:3px;}

.delivery-banner h3{font-size:14px;font-weight:800;margin:0;}
.delivery-banner p{font-size:12px;opacity:.8;margin:3px 0 0;}
.notion-btn{display:inline-flex;align-items:center;gap:6px;background:white;color:#1A1A1A;border:none;border-radius:6px;padding:8px 14px;font-size:12px;font-weight:700;cursor:pointer;text-decoration:none;}
.brand-strip{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;}
.swatch{display:flex;align-items:center;gap:8px;background:white;border:1px solid var(--border);border-radius:8px;padding:8px 12px;font-size:12px;}
.swatch-box{width:28px;height:28px;border-radius:4px;flex-shrink:0;border:1px solid rgba(0,0,0,.1);}
.swatch-label{font-weight:700;}
.swatch-hex{font-family:monospace;color:var(--gray);font-size:10px;}
.swatch-uso{font-size:10px;color:var(--gray);}
.pilar-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;}
.pilar-card{flex:1;min-width:120px;background:white;border:1px solid var(--border);border-radius:8px;padding:10px 14px;border-top:3px solid var(--primary);}
.pilar-cod{font-size:18px;font-weight:800;color:var(--primary);}
.pilar-nome{font-size:12px;font-weight:700;color:#374151;}
.pilar-pct{font-size:20px;font-weight:800;color:var(--accent);margin-top:4px;}
.weeks-table{width:100%;border-collapse:collapse;font-size:13px;}
.weeks-table th{background:var(--primary);color:white;padding:8px 14px;text-align:left;font-size:11px;font-weight:700;text-transform:uppercase;}
.weeks-table td{padding:9px 14px;border-bottom:1px solid var(--border);}
.weeks-table tr:last-child td{border-bottom:none;}
.weeks-table tr:hover td{background:#F9FAFB;}
.s-done{display:inline-block;font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px;background:#D1FAE5;color:#065F46;}
.s-progress{display:inline-block;font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px;background:#FEF3C7;color:#92400E;}
.s-pending{display:inline-block;font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px;background:#F3F4F6;color:#6B7280;}

/* RADAR */
.tab.radar.active{color:#1E90FF;border-bottom-color:#1E90FF;}

.rt-chip-corrente-m{background:#EBF5FF;color:#1E3A5F;border-color:#93C5FD;}
.rt-chip-corrente-m.active{background:#0A1B33;color:#fff;border-color:#0A1B33;}
.rt-chip-proxima-m{background:#F3F4F6;color:#9CA3AF;border-color:#E5E7EB;}
.rt-chip-proxima-m.active{background:#1E90FF;color:#fff;border-color:#1E90FF;}
.rt-chip-proxima-m.locked{opacity:.35;cursor:not-allowed;border-style:dashed;}
.rt-ctx-badge-m{margin-left:auto;padding:3px 10px;border-radius:20px;font-size:10px;font-weight:700;}
.rt-ctx-corrente-m{background:#EBF5FF;color:#1E3A5F;}
.rt-ctx-proxima-m{background:#DBEAFE;color:#1D4ED8;}

.radar-card{background:white;border-radius:10px;border:1px solid var(--border);overflow:hidden;}
.radar-card-head{padding:12px 16px;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--border);}

      "slides": null,
      "legenda": "#### O que já aconteceu, com data e número\nA primeira operação começou em Araçatuba em 25/02/2026, com 16 fiscais e uma lista de 326 condomínios a verificar (fontes: Condomínio Interativo e Crea-SP). Dois meses depois, entre 27 e 30/04/2026, o mesmo modelo foi aplicado em Bragança Paulista, com meta declarada de mais de 220 condomínios (fontes: Portal Atibaia News e Crea-SP). O objetivo declarado pelo próprio conselho é verificar se os serviços de engenharia executados em condomínio têm profissional habilitado e ART emitida (fonte: Crea-SP, página institucional de fiscalização em condomínios).\n\nDuas cidades diferentes, dois meses de intervalo, mesmo método. Isso descreve um programa, não uma ação pontual.\n\n#### Por que isso muda a conversa de contratação, e não só a de conformidade\nAté aqui, a discussão sobre ART em condomínio costumava girar em torno de multa administrativa — um risco distante, que o síndico empurrava para a próxima gestão. A força-tarefa desloca o problema: quando o fiscal chega, quem responde é a gestão que contratou o serviço sem documento, não a que estava lá quando o serviço foi feito.\n\nNa prática, isso reordena a pergunta que o gestor faz ao fornecedor. A pergunta deixa de ser \"quanto custa a inspeção\" e passa a ser \"quem assina tecnicamente o resultado dela\".\n\n#### O escopo que a norma técnica cobre é maior do que a fachada\nVale registrar um segundo ponto que costuma passar batido nessa conversa: a inspeção predial prevista na norma técnica brasileira não se limita à fachada. O escopo alcança também os sistemas elétrico, hidráulico, de esgoto e de drenagem da edificação (ABNT NBR 16747). A NBR 5.674, por sua vez, é a norma de manutenção de edificações e trabalha com periodicidade recomendada de 3 anos.\n\nA consequência é direta: um orçamento que cobre só \"fotografar a fachada\" pode ser mais barato e ainda assim não produzir o documento que a norma — e o fiscal — esperam encontrar.\n\n#### O que isso significa para quem usa drone na inspeção\nDrone não emite ART. Engenheiro emite. O que o drone faz é o que andaime e balancim faziam antes, com menos custo e menos interdição: dar acesso visual completo à fachada e à cobertura para que o diagnóstico técnico seja feito com evidência.\n\nO arranjo que resolve os dois lados é a captação aérea somada ao diagnóstico e à ART de um engenheiro civil com CREA ativo. É assim que a ADFly opera hoje: em um laudo de inspeção predial de três torres em São Paulo, entregue em julho de 2026, o escopo combinou mapeamento aéreo completo das fachadas, inspeção civil e estrutural in loco por engenheiro parceiro e vistoria interna nos últimos pavimentos, com laudo consolidado e ART do responsável técnico.\n\n#### Conclusão\nO gestor predial que ainda trata ART como burocracia opcional está lendo um cenário que mudou no começo deste ano. A fiscalização virou operação de campo, o escopo da norma é maior do que a fachada e o documento que responde pelo serviço é o que o fiscal procura primeiro. Antecipar isso custa uma inspeção. Não antecipar custa a inspeção mais a explicação.",

      "legenda": "#### O SISANT explodiu, e a ANAC criou um setor só pra isso\nO cadastro de aeronaves não tripuladas da ANAC (SISANT) saiu de 16,5 mil equipamentos em 2017 para 160 mil em junho de 2026. Diante desse volume, a ANAC consolidou a aprovação operacional e a fiscalização — antes fragmentadas entre áreas pensadas para aviação tripulada — em uma superintendência dedicada, provisoriamente chamada SAG. Segundo o diretor Cláudio Ianelli, \"todo acompanhamento das operações com aeronaves não tripuladas será realizado pela nova unidade\" (fonte: mundoconectado.com.br, 30/07/2026).\n\n#### O endurecimento veio de um incidente real, não de burocracia por si só\nEm fevereiro de 2026, cerca de sete drones nas proximidades do Aeroporto de Guarulhos causaram três horas de paralisação e desvio de voos durante o Carnaval — episódio que, somado à preocupação com uso criminoso de drones para contrabando, levou a ANAC a apertar as regras da Categoria Específica. É justamente essa categoria — a que mais se aproxima do perfil de operação B2B predial da ADFly — que recebeu prazo de até 2 anos para que os operadores obtenham as autorizações necessárias (fontes: CNN Brasil, 03/07/2026; agenciainfra.com, 12/06/2026).\n\n#### Prazo de 2 anos não é folga — é um filtro\nUm prazo de adequação de 2 anos soa como tempo de sobra. Na prática, ele só é folga para quem já opera como empresa: RETA (seguro de responsabilidade civil), ART de engenheiro parceiro quando aplicável, processo documentado, registro em dia. Para quem opera drone por fora — sem CNPJ estruturado, sem seguro, sem processo — o prazo não dá tempo de \"regularizar depois\": ele expõe, agora, a ausência do que deveria já existir. Quem contrata um prestador nessa condição herda o risco regulatório junto com o serviço.\n\n#### Onde isso encontra a garantia de 5 anos da construtora\nEsse endurecimento regulatório ganha peso extra quando cruzado com outro prazo que já corre em paralelo para qualquer edificação nova: a garantia de 5 anos da construtora, prevista no artigo 618 do Código Civil. Em um caso real executado pela ADFly em julho de 2026 — condomínio residencial de 3 torres em São Paulo, contratante via administradora — a inspeção aérea (drone) somada ao diagnóstico e ART de um engenheiro civil parceiro (CREA ativo) resultou em um laudo técnico de inspeção predial Nível I (NBR 16747 + NBR 17170) pelo valor de R$15.500, com responsabilidade técnica formal. O mesmo escopo de laudo de engenharia, sem a camada aérea, é precificado em torno de R$12.000 pelo engenheiro isoladamente — a captação aérea agregou cerca de R$3.500 ao ticket, um dado útil de referência para quem está avaliando propostas concorrentes hoje. Quando o laudo é produzido dentro do prazo de garantia da construtora, ele deixa de ser só diagnóstico: vira documento que ainda pode respaldar uma cobrança formal, antes que o prazo vença e o custo vire exclusivamente do condomínio.\n\nA régua subiu dos dois lados: a ANAC está fiscalizando com estrutura própria, e a garantia da construtora tem prazo que não espera. Quem contrata inspeção predial com drone deveria perguntar, antes de assinar: o prestador tem RETA? O laudo vem com ART de engenheiro responsável? E o prédio ainda está dentro da janela de garantia?\n\nComenta LAUDO que eu te envio o checklist que aplicamos em cada inspeção com ART — pra você levar pronto na próxima reunião de síndico.",

      "legenda": "#### O recorde que a construção civil não quer repetir\nSegundo a CBIC (Câmara Brasileira da Indústria da Construção), citando dados da Secretaria de Inspeção do Trabalho (SIT/MTE), o Brasil registrou 806.011 acidentes de trabalho e 3.644 mortes em 2025 — o maior número da série histórica monitorada. Entre 2016 e 2025, foram 6,4 milhões de acidentes e 27.486 mortes; entre 2020 e 2025, os acidentes cresceram 65,8% e as mortes, 60,8%. A construção civil segue entre os setores de maior letalidade do país, ao lado de vigilância privada e transporte de produtos perigosos (fonte: cbic.org.br, 06/08/2026).\n\n#### O seguro \"no papel\" que não paga na prática\nEm paralelo, a sinistralidade elevada no segmento de imóveis tem levado seguradoras a endurecer a análise documental na hora de pagar sinistros estruturais. Segundo um levantamento do setor de engenharia de avaliações (fonte com confiança parcial, sem confirmação direta de Susep/CNseg localizada nesta apuração), proprietários e condomínios que apresentam laudos genéricos — feitos para garantia bancária ou inventário, sem ART, sem metodologia compatível com a NBR 14653 e sem habilitação CREA do avaliador para o tipo de risco do imóvel — descobrem o problema só na hora do sinistro, quando o pagamento é negado ou atrasado (fonte: costasaleseng.com.br, 2026).\n\n#### Onde as duas coisas se cruzam\nCada checagem estrutural feita sem exposição de trabalhador em altura é, ao mesmo tempo, um ponto a menos na estatística de acidentes e um documento a mais na defesa de um sinistro. O laudo técnico com ART de engenheiro parceiro — apoiado em captação aérea completa da fachada — cumpre as duas funções ao mesmo tempo: reduz risco de exposição física e produz o documento que a seguradora de fato aceita.\n\n#### Conclusão\nQuem ainda trata inspeção predial como item de manutenção \"quando sobrar orçamento\" está ignorando dois riscos ao mesmo tempo — o físico e o financeiro.\n\n#### Fontes citadas neste artigo\n- function showPage(id,el){document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));document.getElementById('page-'+id).classList.add('active');if(el)el.classList.add('active');}
function statusBadge(s){if(s==='done')return`<span class="s-done">✅ Entregue</span>`;if(s==='progress')return`<span class="s-progress">🔄 Em andamento</span>`;return`<span class="s-pending">⏳ Pendente</span>`;}

function buildTopbar(){document.body.insertAdjacentHTML('afterbegin',`<div class="topbar"><h1>${CLIENTE.emoji} ${esc(CLIENTE.nome.toUpperCase())}</h1><span class="badge">📐 ${esc(CLIENTE.instagram)}</span></div>`);}

function buildTabs(){let h=`<div class="tabs"><div class="tab active" onclick="showPage('dashboard',this)">📊 Dashboard</div>`;SEMANAS.forEach(s=>{const ic=s.status==='done'?'✅':s.status==='progress'?'🔄':'📅';h+=`<div class="tab" onclick="showPage('${s.id}',this)">${ic} Sem. ${esc(s.label)}</div>`;});h+=`<div class="tab radar" onclick="showPage('radar',this)">🔭 Radar</div></div>`;document.getElementById('tabs-container').innerHTML=h;}

function buildDashboard(){
  const swatches=(CLIENTE.cores||[]).map(c=>`<div class="swatch"><div class="swatch-box" style="background:${esc(c.hex)}"></div><div><div class="swatch-label">${esc(c.nome)}</div><div class="swatch-hex">${esc(c.hex)}</div><div class="swatch-uso">${esc(c.uso)}</div></div></div>`).join('');
  const pilares=(CLIENTE.pilares||[]).map(p=>`<div class="pilar-card"><div class="pilar-cod">${esc(p.cod)}</div><div class="pilar-nome">${esc(p.nome)}</div><div class="pilar-pct">${esc(p.pct)}</div></div>`).join('');
  const semRows=SEMANAS.map(s=>`<tr><td><strong>${esc(s.labelFull)}</strong><br><small style="color:var(--gray)">${esc(s.objetivo)}</small></td><td>${statusBadge(s.status)}</td><td>${esc(s.badge)}</td><td>${s.notionUrl?`<a href="${esc(s.notionUrl)}" target="_blank" class="notion-btn" style="font-size:11px;padding:4px 10px">📋 Notion</a>`:'—'}</td></tr>`).join('');
  document.getElementById('pages-container').insertAdjacentHTML('beforeend',`
  <div id="page-dashboard" class="page active">
    <div class="delivery-banner"><div><h3>✈️ ADFly Soluções Aéreas</h3><p>${esc(CLIENTE.cargo)} · ${esc(CLIENTE.instagram)}</p></div></div>
    <div class="files-bar"><div class="files-bar-title">📁 Pasta local</div><div class="files-grid"><div class="path-row"><span class="path-icon">📁</span><div class="path-info"><div class="path-name">Pasta raiz ADFly</div><div class="path-txt">${esc(CLIENTE.pastaLocal)}</div></div><div class="btn-row"><button class="copy-btn" onclick="cp('${CLIENTE.pastaLocal.replace(/\\/g,'\\\\').replace(/'/g,"\\'")}',this)">Copiar</button></div></div></div></div>
    <div class="section-title">🎨 Identidade Visual</div><div class="brand-strip">${swatches}</div>
    <div class="section-title">📌 Pilares de Conteúdo</div><div class="pilar-row">${pilares}</div>
    <div class="section-title">📅 Status das Semanas</div>
    <table class="weeks-table"><thead><tr><th>Semana</th><th>Status</th><th>Badge</th><th>Links</th></tr></thead><tbody>${semRows}</tbody></table>
  </div>`);
}

function buildSemana(s){
  document.getElementById('pages-container').insertAdjacentHTML('beforeend',`
  <div id="page-${s.id}" class="page">
    <div style="background:linear-gradient(135deg,var(--primary) 0%,#1E3A5F 100%);color:white;border-radius:12px;padding:16px 20px;margin-bottom:20px;">
      <div style="font-size:11px;opacity:.6;text-transform:uppercase;letter-spacing:1px;margin-bottom:4px">📅 Semana</div>
      <div style="font-size:16px;font-weight:800;">${esc(s.labelFull)}</div>
      <div style="font-size:12px;opacity:.8;margin-top:4px;">${esc(s.objetivo)}</div>
    </div>
    ${statusBadge(s.status)}
    <div class="section-title">📂 Arquivos</div>
    <div class="files-bar"><div class="files-grid">${(s.arquivos||[]).map(a=>`<div class="path-row"><span class="path-icon">${a.icon}</span><div class="path-info"><div class="path-name">${esc(a.nome)}</div><div class="path-txt">${esc(a.path||'')}</div></div><div class="btn-row">${a.path?`<button class="copy-btn" onclick="cp('${(a.path||'').replace(/\\/g,'\\\\').replace(/'/g,"\\'")}',this)">Copiar</button>`:''}</div></div>`).join('')}</div></div>
    <div class="section-title">&#128197; Grade Editorial</div>
    ${(function(){if(!s.grade||!s.grade.length)return'';var cols='grid-template-columns:90px repeat(4,1fr)';var h='<div class="grade-wrap"><div class="grade-grid" style="'+cols+'">';h+='<div class="grade-cell header">DIA</div><div class="grade-cell header" style="background:#E1306C;color:white">Instagram</div><div class="grade-cell header" style="background:#000;color:white">TikTok</div><div class="grade-cell header" style="background:#0A66C2;color:white">LinkedIn</div><div class="grade-cell header" style="background:#FF0000;color:white">YouTube</div>';(s.grade||[]).forEach(function(g){h+='<div class="grade-cell dayname">'+esc(g.dia)+'</div>';[g.ig,g.tk,g.li,g.yt].forEach(function(c){if(!c){h+='<div class="grade-cell empty">&#8212;</div>';return;}var arr=Array.isArray(c)?c:[c];h+='<div class="grade-cell">'+arr.map(function(x){return '<span class="chip">'+esc(x.chip)+'</span><br>'+esc(x.txt);}).join('<hr style="border:none;border-top:1px dashed #E5E7EB;margin:5px 0">')+'</div>';});});return h+'</div></div>';})()}
    ${(function(){
      if(!(s.posts&&s.posts.length))return'';
      var h='<div class="section-title">✍️ Posts Detalhados · Copy + Roteiro</div>';
      s.posts.forEach(function(p,i){
        var aid='aip-'+i+'-'+(p.dia||'').replace(/[^a-z0-9]/gi,'');
        h+='<div class="content-card">';
        h+='<div class="content-header">';
        h+='<span class="post-day">'+esc(p.dia||'')+'</span>';
        h+='<span class="post-title">'+esc(p.titulo||'')+'</span>';
        h+='<span class="post-pilar">Pilar '+esc(p.pilar||'')+'</span>';
        h+='</div>';
        h+='<div class="post-formato">'+esc(p.formato||'')+'</div>';
        h+='<div class="content-body">';
        h+='<div class="post-label">Gancho</div>';
        h+='<div class="post-gancho">“'+esc(p.gancho||'')+'”</div>';
        if(p.slides){h+='<div class="post-label">Slides</div><div class="post-block">'+esc(p.slides)+'</div>';}
        if(p.legenda){h+='<div class="post-label">Legenda / Caption</div><div class="post-block">'+esc(p.legenda).replace(/\n/g,'<br>')+'</div>';}
        if(p.cta){h+='<div class="post-label">CTA</div><div class="post-block">'+esc(p.cta)+'</div>';}
        if(p.hashtags){h+='<div class="post-hashtags">'+esc(p.hashtags)+'</div>';}
        if(p.stories&&Array.isArray(p.stories)){h+='<div class="post-label">Stories IG</div><ul class="post-stories">'+p.stories.map(function(st){return'<li>'+esc(st)+'</li>';}).join('')+'</ul>';}
        if(p.aiPrompt){h+='<div class="ai-prompt-block"><div class="ai-prompt-label">🎨 AI Prompt</div><textarea class="ai-prompt-ta" id="'+aid+'" readonly>'+esc(p.aiPrompt)+'</textarea><button class="copy-ai-btn" onclick="copyAiPrompt(\''+aid+'\',this)">Copiar Prompt</button></div>';}
        h+='</div></div>';
      });
      return h;
    })()}
  </div>`);
}

function buildRadar(){
  const SC=RADAR.semanaCorrente, SP=RADAR.semanaProxima;
  function buildCards(lista){return lista.map(c=>`<div class="radar-card"><div class="radar-card-head" style="background:${esc(c.headBg)};color:${esc(c.headFg)}">${esc(c.nome)}<span class="radar-tag" style="background:${esc(c.tagBg)};color:${esc(c.tagFg)};margin-left:auto">${esc(c.tag)}</span></div><div class="radar-card-body"><div class="comp-fields"><div class="comp-field"><div class="cf-label">📢 O que publicaram</div><div class="cf-value">${esc(c.oQuePublicaram||'—')}</div></div><div class="comp-field"><div class="cf-label">🎯 O que ADFly usa disso</div><div class="cf-value">${esc(c.opp)}</div></div></div></div></div>`).join('');}
  function buildTend(lista){return lista.map(t=>`<div class="trend-card"><h4>${esc(t.titulo)}</h4><p>${esc(t.corpo)}</p>${t.gancho?`<div style="margin-top:8px;padding:8px 12px;background:#EBF5FF;border-left:3px solid #1E90FF;border-radius:4px;font-size:12px;color:#1E3A5F;font-style:italic">${esc(t.gancho)}</div>`:''} ${t.src?`<div style="font-size:10px;opacity:.5;margin-top:6px">Fonte: ${esc(t.src)}</div>`:''}</div>`).join('');}
  function buildAlertas(lista){return lista.map(a=>{const cls=a.nivel==='alto'?'threat-alto':a.nivel==='opp'?'threat-opp':'threat-medio';return`<div class="threat-card ${cls}"><h4>${esc(a.titulo)}</h4><div class="threat-corpo">${esc(a.corpo)}</div></div>`;}).join('');}
  const alertasAltos=(SC.alertas||[]).filter(a=>a.nivel==='alto').length;
  const pulseHtml=`<div class="pulse-strip"><div class="pulse-chip"><div class="pulse-num">${SC.concorrentes.length}</div><div class="pulse-lbl">perfis<br>monitorados</div></div><div class="pulse-chip"><div class="pulse-num">${SC.tendencias.length}</div><div class="pulse-lbl">tendências<br>monitoradas</div></div><div class="pulse-chip ${alertasAltos>0?'alert':''}"><div class="pulse-num">${SC.alertas.length}</div><div class="pulse-lbl">alertas &<br>oportunidades</div></div></div>`;
  const topAlerta=(SC.alertas||[]).find(a=>a.nivel==='alto');
  const alertBanner=topAlerta?`<div class="alert-banner"><div class="ab-icon">⚠️</div><div><div class="ab-title">${esc(topAlerta.titulo)}</div><div class="ab-acao">${esc(topAlerta.corpo)}</div></div></div>`:'';
  document.getElementById('pages-container').insertAdjacentHTML('beforeend',`
  <div id="page-radar" class="page">
    <div class="radar-header"><div><div style="font-size:11px;opacity:.6;margin-bottom:4px;text-transform:uppercase;letter-spacing:1px">🔭 Inteligência Competitiva</div><h2>Radar · ADFly Soluções Aéreas</h2><div class="radar-meta">Última execução: ${esc(RADAR.ultimaExecucao)} · Próxima: ${esc(RADAR.proximaExecucao)}</div></div><span class="radar-badge">${SC.concorrentes.length} perfis + nichos monitorados</span></div>
    ${pulseHtml}${alertBanner}
    <div class="rt-toggle-m" id="radarToggleM">
      <span class="rt-chip-m rt-chip-corrente-m" id="rtMChipCorrente" onclick="setRadarModeM('corrente')">📊 Semana em curso · ${esc(SC.label)}</span>
      <span class="rt-chip-m rt-chip-proxima-m" id="rtMChipProxima" onclick="setRadarModeM('proxima')">🔮 Próxima semana · ${esc(SP.label)}</span>
      <span id="rtMContextBadge" class="rt-ctx-badge-m"></span>
    </div>
    <div id="rtMSecCorrente">
      <div class="section-title">👥 Perfis e nichos monitorados</div>
      <div class="radar-grid">${buildCards(SC.concorrentes)}</div>
      <div class="section-title">📈 Tendências de mercado</div><div class="trend-grid">${buildTend(SC.tendencias)}</div>
      <div class="section-title">🚨 Alertas e oportunidades</div>${buildAlertas(SC.alertas)}
    </div>
    <div id="rtMSecProxima" style="display:none">
      <div class="section-title">👥 Perfis e nichos monitorados</div>
      <div class="radar-grid">${buildCards(SP.concorrentes)}</div>
      <div class="section-title">📈 Tendências de mercado <span style="margin-left:8px;font-size:11px;background:#EBF5FF;color:#1E3A5F;padding:2px 8px;border-radius:10px;font-weight:500">com gancho editorial</span></div><div class="trend-grid">${buildTend(SP.tendencias)}</div>
      <div class="section-title">🚨 Alertas e oportunidades</div>${buildAlertas(SP.alertas)}
    </div>
  </div>`);
}

function _radarAutoModeM(){var d=new Date().getDay();return(d>=4||d===0)?'proxima':'corrente';}
function setRadarModeM(m){var auto=_radarAutoModeM();if(m==='proxima'&&auto!=='proxima')return;var cc=document.getElementById('rtMChipCorrente');var cp2=document.getElementById('rtMChipProxima');var badge=document.getElementById('rtMContextBadge');var secC=document.getElementById('rtMSecCorrente');var secP=document.getElementById('rtMSecProxima');if(!cc)return;cc.classList.toggle('active',m==='corrente');cp2.classList.toggle('active',m==='proxima');if(secC)secC.style.display=m==='corrente'?'block':'none';if(secP)secP.style.display=m==='proxima'?'block':'none';if(m==='corrente'){badge.textContent='Semana em andamento';badge.className='rt-ctx-badge-m rt-ctx-corrente-m';}else{badge.textContent='🔮 Próxima semana';badge.className='rt-ctx-badge-m rt-ctx-proxima-m';}}
function initRadarToggleM(){var auto=_radarAutoModeM();var cp2=document.getElementById('rtMChipProxima');if(!cp2)return;if(auto!=='proxima'){cp2.classList.add('locked');cp2.title='Disponível toda quinta às 08h';}setRadarModeM(auto);}

function copyAiPrompt(id,btn){var ta=document.getElementById(id);if(!ta)return;ta.select();document.execCommand('copy');var orig=btn.textContent;btn.textContent='✓ Copiado!';setTimeout(function(){btn.textContent=orig;},1800);}

(function init(){
  document.body.insertAdjacentHTML('beforeend','<div id="tabs-container"></div><div id="pages-container"></div>');
  buildTopbar(); buildTabs(); buildDashboard();
  SEMANAS.forEach(s=>buildSemana(s));
  buildRadar(); initRadarToggleM();
  showPage('dashboard',document.querySelector('.tab'));
})();
</script>
</body>
</html>
