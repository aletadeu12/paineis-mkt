O que a escala realmente prova

O setor de franquias no Brasil faturou R$ 308,4 bilhões nos últimos doze meses e cresceu 10,1% no primeiro trimestre de 2026, segundo a ABF — Associação Brasileira de Franchising. Esse número diz algo importante: o modelo de franquia, no Brasil, funciona. Ele atrai investidor, padroniza operação e escala rápido.

O que ele não diz é nada sobre a sua empresa.

Quando uma operação de marketing chega a centenas de unidades, ela provou uma coisa muito específica: que o modelo de negócio dela vende bem para franqueados. É uma prova de mercado interno, não de resultado externo. São dois produtos diferentes sendo validados ao mesmo tempo, e é fácil confundir um com o outro na hora de assinar contrato.

O que a padronização cobra em troca

Escala só existe com padronização. É isso que faz uma rede funcionar — e é exatamente isso que ela cobra de volta. Quanto maior a rede, mais a entrega depende de um processo replicado localmente, e menos ela depende do raciocínio de quem desenhou o método. Numa rede, a pessoa cujo nome atrai o cliente e a pessoa que efetivamente atende o cliente costumam ser pessoas diferentes.

Isso não é crítica moral. É estrutura. Franquia é um modelo desenhado para replicar padrão, não para replicar julgamento.

Por que isso pesa mais em 2026 do que pesava em 2020

Porque o critério de compra mudou. Segundo levantamento divulgado pela CNDL/Varejo S.A., 66% dos líderes de marketing já usam inteligência artificial no trabalho — e o conteúdo passou a funcionar como ativo de confiança, com cases reais e prova social pesando mais do que promessa genérica na decisão de compra B2B.

Quando todo mundo tem acesso à mesma ferramenta, a ferramenta para de ser diferencial. O que sobra como diferencial é o julgamento aplicado ao seu caso: quem leu o seu mercado, quem sabe qual objeção o seu cliente levanta na terceira reunião, quem decide o que não entra na sua grade editorial.

O critério que substitui "tamanho"

Se tamanho não é o critério, qual é? Um que dá para verificar antes de assinar: o marketing que estão te vendendo conversa com a sua área de vendas?

O benchmark B2B compilado pela Atendare aponta que empresas com marketing e vendas operando de forma integrada relatam até 20% mais crescimento de receita e 67% mais eficiência no fechamento. É um dado de fornecedor de martech, não de associação setorial — trato como indicativo de direção, não como estatística oficial fechada. Mas a direção é consistente com tudo o que se vê na prática: o gargalo raramente está no anúncio. Está na costura entre quem gera o lead e quem conversa com ele.

E há um contraponto que merece estar na mesma mesa: reportagem do Meio&Mensagem sobre as tendências de 2026, com base no Panorama RD Station, registra que 58% das empresas já usam IA no marketing sem estratégia integrada, consistente ou madura, e que 71% não bateram suas metas de marketing em 2024. Mais ferramenta disponível do que nunca. Meta não batida mesmo assim.

Três perguntas para fazer antes de assinar qualquer proposta

1. Quem exatamente vai ler o meu mercado toda semana — e eu consigo falar com essa pessoa? Se a resposta for um departamento sem nome, o julgamento sobre o seu negócio não está incluído no contrato.
2. O que vocês decidiram NÃO fazer no último cliente parecido comigo, e por quê? Método aparece nas exclusões, não na lista de entregáveis.
3. Como esse conteúdo chega em quem vende? Se a resposta for "a gente entrega o post", você comprou produção. Não comprou marketing.

Escala é uma resposta legítima para a pergunta "esse negócio funciona?". Só que a sua pergunta é outra: "isso funciona para mim?". São perguntas diferentes, e só uma delas define se você vai ter resultado no fim do trimestre.

(function() {
  const r = document.documentElement.style;
  r.setProperty('--primary', CLIENTE.primary);
  r.setProperty('--accent',  CLIENTE.accent);
  r.setProperty('--bglight', CLIENTE.bgLight);
})();

function esc(s) {
  if (!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function cp(txt, btn) {
  if (!txt) return;
  navigator.clipboard.writeText(txt).then(() => {
    btn.classList.add('ok'); btn.textContent = '✓';
    const t = document.getElementById('toast');
    t.classList.add('show');
    setTimeout(() => { t.classList.remove('show'); btn.classList.remove('ok'); btn.textContent = 'Copiar'; }, 1800);
  });
}

function showPage(id, el) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.getElementById('page-' + id).classList.add('active');
  if (el) el.classList.add('active');
}

function statusBadge(s) {
  if (s==='done')     return `<span class="s-done">✅ Entregue</span>`;
  if (s==='progress') return `<span class="s-progress">🔄 Em andamento</span>`;
  return `<span class="s-pending">⏳ Pendente</span>`;
}

          <div style="font-size:11px;opacity:.6;margin-bottom:4px;text-transform:uppercase;letter-spacing:1px">🔭 Inteligência Competitiva</div>
          <h2>Radar · ${esc(CLIENTE.nome)}</h2>
          <div class="radar-meta">Última execução: ${esc(RADAR.ultimaExecucao)} · Próxima: ${esc(RADAR.proximaExecucao)}</div>
        </div>
        <span class="radar-badge">${SC.concorrentes.length} concorrentes monitorados</span>
      </div>

      ${pulseHtml}
      ${alertBannerHtml}

      <div class="rt-toggle-t">
        <button id="rtTChipCorrente" class="rt-chip-t rt-chip-corrente-t" onclick="setRadarModeT('corrente')">📊 Semana em curso · ${esc(SC.label)}</button>
        <button id="rtTChipProxima"  class="rt-chip-t rt-chip-proxima-t"  onclick="setRadarModeT('proxima')">🔮 Próxima semana · ${esc(SP.label)}</button>
        <span id="rtTCtxBadge" class="rt-ctx-badge-t"></span>
      </div>

      <div id="rtTSecCorrente">
        <div class="section-title">👥 Concorrentes monitorados</div>
        <div class="radar-grid">${cardsHtml}</div>
        ${tendenciasHtml ? `<div class="section-title">📈 Tendências de mercado</div><div class="trend-grid">${tendenciasHtml}</div>` : ''}
        ${ameacasHtml ? `<div class="section-title">🚨 Alertas e oportunidades</div>${ameacasHtml}` : ''}
      </div>

      <div id="rtTSecProxima" style="display:none">
        <div class="section-title">👥 Concorrentes monitorados</div>
        <div class="radar-grid">${cardsHtmlP}</div>
        ${tendenciasHtmlP ? `<div class="section-title">📈 Tendências de mercado <span style="margin-left:8px;font-size:11px;background:#1E3A5F;color:#93C5FD;padding:2px 8px;border-radius:10px;font-weight:500">com gancho editorial</span></div><div class="trend-grid">${tendenciasHtmlP}</div>` : ''}
        ${ameacasHtmlP ? `<div class="section-title">🚨 Alertas e oportunidades</div>${ameacasHtmlP}` : ''}
      </div>
    </div>`);
}

/* ── Radar Toggle TRAÇÃO ── */
function _radarAutoModeT() {
  var d = new Date().getDay(); // 0=Dom,1=Seg,...,6=Sab
  return (d >= 4 || d === 0) ? 'proxima' : 'corrente';
}
function setRadarModeT(m) {
  var cc = document.getElementById('rtTSecCorrente');
  var cp2 = document.getElementById('rtTSecProxima');
  var bc = document.getElementById('rtTChipCorrente');
  var bp = document.getElementById('rtTChipProxima');
  var badge = document.getElementById('rtTCtxBadge');
  if (!cc || !cp2) return;
  if (m === 'proxima') {
    cc.style.display = 'none'; cp2.style.display = 'block';
    bc.classList.remove('active'); bp.classList.add('active');
    badge.textContent = '🔮 Planejando próxima semana';
    badge.className = 'rt-ctx-badge-t rt-ctx-proxima-t';
  } else {
    cc.style.display = 'block'; cp2.style.display = 'none';
    bc.classList.add('active'); bp.classList.remove('active');
    badge.textContent = '📊 Inteligência da semana atual';
    badge.className = 'rt-ctx-badge-t rt-ctx-corrente-t';
  }
}
function initRadarToggleT() {
  var auto = _radarAutoModeT();
  var bp = document.getElementById('rtTChipProxima');
  if (!bp) return;
  if (auto !== 'proxima') {
    bp.classList.add('locked');
    bp.title = 'Disponível toda quinta às 08h após execução do radar';
  }
  setRadarModeT(auto);
}

(function init() {
  document.body.insertAdjacentHTML('beforeend', '<div id="tabs-container"></div><div id="pages-container"></div>');
  buildTopbar();
  buildTabs();
  buildDashboard();
  SEMANAS.forEach(s => buildSemana(s));
  buildRadar();
  initRadarToggleT();
  showPage('dashboard', document.querySelector('.tab'));
})();
/* ── AI Prompt Copy ── */
function copyAiPrompt(id, btn) {
  var ta = document.getElementById(id);
  if (!ta) return;
  ta.select();
  document.execCommand('copy');
  var orig = btn.textContent;
  btn.textContent = '✓ Copiado!';
  setTimeout(function(){ btn.textContent = orig; }, 1800);
}
</script>

</body>
